<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Beauty Products</title>
    <link rel="stylesheet" href="./../../../../src/css/style.css">
    <link rel="stylesheet" href="../../../../src/css/pages/plp-product.css">
    <style>
  .toast-container {
    position: fixed;
    top: var(--space-5);
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
    z-index: 9999;
  }

  [dir="ltr"] .toast-container {
    right: var(--space-5);
    left: auto;
  }

  [dir="rtl"] .toast-container {
    left: var(--space-5);
    right: auto;
  }
  .toast {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 22px;
    background: #faf9fb;
    border-left: 4px solid #4d3b68;
    border-radius: 12px;
    color: #40364f;
    font-family: Georgia, 'Times New Roman', Times, serif;
    font-size: clamp(15px, 1.5vw, 20px);
    font-weight: 400;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.8);
    width: min(520px, calc(100vw = 40px));
    box-sizing: flex;
    display: flex;
  }
</style>
</head>
<body>
    <nav class="breadcrumb">
    <a href="">
        <span id="breadcrumbHome"> Home</span>
    </a>
    <span>/</span>
    <a href="">
        <span id="breadcrumbWomen"> Women</span>
    </a>
    <span>/</span>
    <a href="./beauty-collection.html">
        <span id="breadcrumbBeautyTools"> Beauty Tools </span>
    </a>
    <span>/</span>
    <span id="breadcrumbTitle"> Beauty Products</span>
    </nav>
    <!-- PLP HEADER -->
    <header class="plp-header">
        <div class="container">
            <div class="language-switcher">
        <button id="languageToggle" class="btn btn-secondary">EN</button>
      </div>
            <h1 id="pageTitle" class="plp-header__title"> Beauty Products </h1>
            <p id="pageDescription" class="plp-header__description"> Discover our beauty collection. </p>
            <p id="productsCount" class="plp-header__count"> </p>
        </div>
    </header>
    <main>
        <section class="beauty-products">
            <div class="container">

                <!-- SEARCH -->
                <div class="products-toolbar">
                    <div class="search-box">
    <svg class="search-box__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M10 18a8 8 0 1 1 5.292-14.002A8 8 0 0 1 10 18zm11 3-6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <input id="productSearch" type="search" class="search-box__input" placeholder="Search products..." autocomplete="off">
                </div>
                </div>

                <!-- PRODUCT GRID -->
                <div id="productGrid" class="product-grid">
                <!-- EMPTY STATE -->
                <div id="emptyState" class="empty-state hidden">
                    <h2 id="emptyTitle"> No Products Found </h2>
                    <p id="emptyDescription"> Try another keyword. </p>
                </div>
            </div>
        </section>

        <!-- PREVIEW MODAL -->
    <div id="previewModal" class="preview-modal">
        <div class="preview-overlay">
        </div>
        <div class="preview-content">
        </div>
    </div>
    <div id="toastContainer"></div>

    <script type="module" src="./beauty-products-preview.js"> </script>
</main>
</body>
</html>
